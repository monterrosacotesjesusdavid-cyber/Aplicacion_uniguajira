name: uniguajira_asistencia
description: Sistema de Control de Asistencia - Universidad de La Guajira
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.3
  geolocator: ^11.0.0
  camera: ^0.10.5+9
  permission_handler: ^11.3.0
  intl: ^0.19.0
  google_mlkit_face_detection: ^0.11.0
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3
  path_provider: ^2.1.3
  url_launcher: ^6.2.5
  pdf: ^3.11.1
  printing: ^5.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icono.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icono.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
